# text-message-worker:平台代發後端(Cloudflare Workers + KV)
# 部署步驟與 secrets 設定見 docs/BACKEND.md;本檔需在部署前:
#   1. 建立 KV namespace 並將 id 填入下方 QUEUE
#   2. 確認 FRONTEND_URL 指向你的前端網址(含路徑)

name = "text-message-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# 排程 cron:每小時整點掃描到期項目(2026-09-08 維護者調整;排程發佈=整點批次,精度 ±60 分)。
# 勿改回每分鐘:KV 免費方案 list 上限 1,000 次/日,每分鐘掃描=1,440 次會超額導致隔夜排程失效;
# 若未來需要分鐘級精度,改「佇列旗標鍵」設計(有項目才 list)——見 docs/BACKEND.md §5。
[triggers]
crons = ["0 */1 * * *"]

[[kv_namespaces]]
binding = "QUEUE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# 前端完整網址(CORS 白名單與 OAuth 完成後回跳目標)
FRONTEND_URL = "https://galen-chu.github.io/TEXT-Message/"

# secrets(wrangler secret put 設定,勿寫進本檔):
#   THREADS_CLIENT_ID / THREADS_CLIENT_SECRET / TOKEN_ENCRYPTION_KEY
