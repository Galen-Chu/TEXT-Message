name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # action 自身 runtime 升 node24(2026-10-14;runner 需 ≥ v2.327.1,GitHub 托管已滿足)
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 單元測試(純邏輯模組)
      - run: npm test
      # WCAG AA 對比度(從 src/index.css 解析 token,未達標即失敗)
      - run: npm run test:contrast
      # 建置(無 secret 環境 = 同時持續驗證「示範模式」建置路徑)
      - run: npm run build
      # E2E smoke 跑在 preview server(示範模式,不觸碰 Google 網路)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
